[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.34"   # one exact compiler
deny = "warnings"         # warnings fail the build, e.g. the transfer/send deprecation warning
# Foundry's defaults, plus "unreachable": code after a call to an unfinished function (a TODO that reverts) is unreachable.
ignored_error_codes = ["license", "code-size", "init-code-size", "transient-storage", "unreachable"]
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 1_000              # Foundry's default is 256
